<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>FinnVid - Your Corner for Home Movies</title>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff}
body{margin:0;background:#fff;color:#000;font:13px Arial,Helvetica,sans-serif;padding:6px}
a{color:#0000cc}
.nav{background:#fff;border-bottom:1px solid #ccc;padding:5px 6px;font-size:11px;font-weight:bold}
.nav span{color:#666;font-weight:normal;padding:0 3px}
.nav a{font-size:11px}
.acct{text-align:right;font-size:11px;font-weight:bold;margin:4px 2px 5px}
.acct span{font-weight:normal;color:#666}
.wrap{max-width:760px;margin:0 auto;text-align:center}
.logo{margin:34px auto 6px;display:block;width:230px;max-width:70%;height:auto}
.tag{font-size:10px;margin-bottom:22px}
hr{border:0;border-top:1px solid #aaa;width:300px;max-width:80%;margin:0 auto 18px}
form{margin:0}
.q{width:260px;max-width:70%;border:1px solid #7f9db9;background:#fff;color:#000;font:13px Arial;padding:2px 3px;display:block;margin:0 auto 10px;height:22px}
.btn{font:11px Arial;padding:1px 6px;border:2px outset #ddd;background:#e8e8e8;color:#000;cursor:pointer}
.btn:active{border-style:inset}
.big{margin:24px 0 20px;font-size:13px;font-weight:bold}
.big a{margin:0 4px}
.new{background:#ff0;color:#c00;font-size:7px;padding:0 2px;font-weight:bold;vertical-align:middle}
.feat{background:#fff;border:1px solid #bbb;padding:6px;margin:0 auto;max-width:560px;text-align:left}
.feat .h{display:flex;justify-content:space-between;font-size:11px;font-weight:bold;color:#555}
.feat .in{background:#fff;border:1px solid #e2e2e2;margin-top:4px;padding:26px 8px;text-align:center;font-size:11px;color:#666}
.foot{margin-top:22px;font-size:10px}
.foot a{font-size:10px}
.rss{display:inline-block;background:#f60;color:#fff;font:bold 8px Arial;padding:1px 3px;border:1px solid #c40;text-decoration:none;vertical-align:middle}
</style>
</head>
<body>

<div class="nav">
  <a href="#home">Home</a><span>|</span><a href="#v">My Videos</a><span>|</span><a href="#f">My Favorites</a><span>|</span><a href="#m">My Messages</a><span>|</span><a href="#p">My Profile</a>
</div>
<div class="acct"><a href="#signup">Sign Up</a> <span>|</span> <a href="#login">Log In</a> <span>|</span> <a href="#help">Help</a></div>

<div class="wrap">
  <svg class="logo" viewBox="0 0 345 120" role="img" aria-label="FinnVid">
    <text x="0" y="92" font-family="Impact,'Arial Narrow','Haettenschweiler','Arial Black',sans-serif" font-size="92" font-weight="900" textLength="172" lengthAdjust="spacingAndGlyphs" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round">Finn</text>
    <rect x="176" y="6" width="166" height="106" rx="22" fill="#8a5a2b"/>
    <text x="259" y="94" text-anchor="middle" font-family="Impact,'Arial Narrow','Haettenschweiler','Arial Black',sans-serif" font-size="92" font-weight="900" textLength="138" lengthAdjust="spacingAndGlyphs" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round">Vid</text>
  </svg>
  <div class="tag">Your Corner for Home Movies</div>
  <hr>
  <form onsubmit="return false">
    <input class="q" type="text" aria-label="Search">
    <input class="btn" type="submit" value="Search Videos">
  </form>

  <div class="big"><a href="#upload">Upload Videos</a> // <a href="#browse">Browse Videos</a> <span class="new">NEW</span></div>

  <div class="feat">
    <div class="h"><span>Featured Videos</span><a href="#more">See More Videos</a></div>
    <div class="in">No videos have been uploaded yet.</div>
  </div>

  <div class="foot">
    <a href="#about">About Us</a> | <a href="#help">Help</a> | <a href="#terms">Terms of Use</a> | <a href="#privacy">Privacy Policy</a> | Copyright &copy; 2026 FinnVid, LLC&trade; | <a class="rss" href="#rss">RSS</a>
  </div>
</div>

</body>
</html>
